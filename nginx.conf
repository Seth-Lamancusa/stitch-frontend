server {
    listen 8080;
    
    # Enable detailed logging
    error_log /dev/stdout debug;
    access_log /dev/stdout;
    
    # Add security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://plausible.io wss://* https://stitch-backend-659986757275.us-central1.run.app; frame-src 'self';";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    
    # Serve built asset files directly and do NOT fall back to index.html
    # This prevents HTML being returned for missing assets (which breaks MIME types)
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Frontend static files (SPA fallback)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Ensure the HTML shell is not cached to avoid stale hashed asset refs
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    
    # WebSocket connections
    location /ws/ {
        proxy_pass https://stitch-backend-qympdyuwha-ue.a.run.app;
        
        # WebSocket specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host stitch-backend-qympdyuwha-ue.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s; # Long timeout for WebSocket connections
        
        # Disable buffering for WebSockets
        proxy_buffering off;
    }
    
    # Prometheus metrics endpoint
    location /metrics {
        proxy_pass https://stitch-backend-qympdyuwha-ue.a.run.app/metrics;
        
        # Set the Host header to the backend domain
        proxy_set_header Host stitch-backend-qympdyuwha-ue.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Metrics should be plain text, no CORS needed for Prometheus scraping
        # But allow browser access for debugging
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        
        # Handle OPTIONS method for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Add timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        
        # Handle errors
        proxy_intercept_errors on;
        error_page 502 = @backend_down;
    }

    # Backend API requests
    location /api/ {
        # Don't rewrite the API path and keep the /api/ prefix
        proxy_pass https://stitch-backend-qympdyuwha-ue.a.run.app;
        
        # Set the Host header to the backend domain
        proxy_set_header Host stitch-backend-qympdyuwha-ue.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        # Handle OPTIONS method for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Add timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        
        # Handle errors
        proxy_intercept_errors on;
        error_page 502 = @backend_down;
    }
    
    # Backend down handler
    location @backend_down {
        default_type application/json;
        return 502 '{"error": "Backend service unavailable", "code": 502}';
    }
} 