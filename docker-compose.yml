# 1. Code pushed to main (agent or human)
# 2. GitHub Actions detects the push, rebuilds the image, pushes to Artifact Registry, and deploys to the service VM

services:
  stitch-frontend:
    container_name: stitch-frontend
    image: ${ IMAGE_PATH }
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 2G
 