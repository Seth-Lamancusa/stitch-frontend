<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <script defer data-domain="stitch.fyi" src="https://plausible.io/js/script.js"></script>
    <!-- Favicon for bookmarks bar and browser tabs -->
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png?v=2">
    <link rel="shortcut icon" href="/favicon_io/favicon.ico?v=2">
    <!-- Apple touch icon for mobile -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png?v=2">
    <!-- Android Chrome icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon_io/android-chrome-192x192.png?v=2">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon_io/android-chrome-512x512.png?v=2">
    <!-- Web App Manifest -->
    <link rel="manifest" href="/favicon_io/site.webmanifest?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
      html, body, #app { margin: 0; height: 100%; background: #121110; }
      .boot-fallback {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #121110;
        background-image: linear-gradient(160deg, #1a2420 0%, #1a1416 100%);
      }
      .boot-fallback::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: url("/textures/tap-texture-2.avif");
        background-repeat: repeat;
        background-size: 420px;
        filter: contrast(1.4) brightness(1.15);
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-fallback">
        <noscript>
          <strong>We're sorry but Stitch doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
