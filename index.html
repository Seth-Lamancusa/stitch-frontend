<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <script defer data-domain="stitch.fyi" src="https://plausible.io/js/script.js"></script>
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #333;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        margin-bottom: 20px;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-left-color: #09f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Fallback content that will be replaced by Vue when it loads -->
      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading Stitch...</p>
        <noscript>
          <strong>We're sorry but Stitch doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
