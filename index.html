<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <script defer data-domain="stitch.fyi" src="https://plausible.io/js/script.js"></script>
    <!-- Favicon for bookmarks bar and browser tabs -->
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png?v=2">
    <link rel="shortcut icon" href="/favicon_io/favicon.ico?v=2">
    <!-- Apple touch icon for mobile -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png?v=2">
    <!-- Android Chrome icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon_io/android-chrome-192x192.png?v=2">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon_io/android-chrome-512x512.png?v=2">
    <!-- Web App Manifest -->
    <link rel="manifest" href="/favicon_io/site.webmanifest?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
      body {
        font-family: var(--font-family-base);
        background: #f5f5f5;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #333;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        margin-bottom: 20px;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-left-color: #09f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Fallback content that will be replaced by Vue when it loads -->
      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading Stitch...</p>
        <noscript>
          <strong>We're sorry but Stitch doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
