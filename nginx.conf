server {
    listen 8080;
    
    # Enable detailed logging
    error_log /dev/stdout debug;
    access_log /dev/stdout;
    
    # Add security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseio.com https://*.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://* https://stitch-backend-659986757275.us-central1.run.app; frame-src 'self' https://*.firebase.com;";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    
    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API requests
    location /api/ {
        proxy_pass https://stitch-backend-659986757275.us-central1.run.app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        # Handle errors
        proxy_intercept_errors on;
        error_page 502 = @backend_down;
    }
    
    # Backend down handler
    location @backend_down {
        default_type application/json;
        return 502 '{"error": "Backend service unavailable", "code": 502}';
    }
} 