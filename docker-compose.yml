# Production / droplet: SSH in, git pull, docker compose up --build

services:
  stitch-frontend:
    container_name: stitch-frontend
    build: .
    restart: unless-stopped
    ports:
      # Caddy on the host is the public entry. Same bind as taylor.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "api.stitch.fyi:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G
