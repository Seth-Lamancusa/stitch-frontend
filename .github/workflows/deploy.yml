name: Build and Deploy

on:
  push:
    branches: [ "main" ]
 
env:
  IMAGE_NAME: stitch-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Auth to Cloud Provider (Google here)
      - name: Cloud Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 2. Login to Docker
      - name: Docker Auth
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: ${{ secrets.REGISTRY_DOMAIN }}

      # 3. Build & Push
      - name: Build and Push
        uses: 'docker/build-push-action@v5'
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_PATH }}/${{ env.IMAGE_NAME }}:latest

      # 4. SSH Deploy (Generic)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: FULL_IMAGE_NAME
          script: |
            cd ~/stitch-frontend
            # Authenticate VM to the registry (GCP specific helper)
            gcloud auth configure-docker ${{ secrets.REGISTRY_DOMAIN }} --quiet
            
            # Pull and Update
            docker compose pull
            docker compose up -d
            
            # Housekeeping
            docker image prune -f
        env:
          FULL_IMAGE_NAME: ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_PATH }}/${{ env.IMAGE_NAME }}:latest
